<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150" fill="none">
  <!-- Garden gallery easel: wooden tripod holding a framed photo, with floral accents -->
  <defs>
    <linearGradient id="ge-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B08457"/>
      <stop offset="1" stop-color="#8A6240"/>
    </linearGradient>
    <linearGradient id="ge-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#EFE3CC"/>
    </linearGradient>
    <linearGradient id="ge-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDEAD2"/>
      <stop offset="1" stop-color="#A5D6A7"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="60" cy="142" rx="38" ry="6" fill="#000000" opacity="0.12"/>

  <!-- back leg -->
  <rect x="58" y="40" width="6" height="100" rx="3" fill="#6F4E32"/>

  <!-- front legs -->
  <rect x="26" y="36" width="7" height="106" rx="3.5" fill="url(#ge-wood)" transform="rotate(8 29 90)"/>
  <rect x="87" y="36" width="7" height="106" rx="3.5" fill="url(#ge-wood)" transform="rotate(-8 90 90)"/>

  <!-- cross brace -->
  <rect x="26" y="104" width="68" height="6" rx="3" fill="#9A6E45"/>

  <!-- canvas frame -->
  <rect x="24" y="24" width="72" height="62" rx="4" fill="url(#ge-frame)" stroke="#C9A66B" stroke-width="3"/>
  <!-- inner photo -->
  <rect x="31" y="31" width="58" height="48" rx="2" fill="url(#ge-sky)"/>
  <!-- photo motif: rolling hills + heart -->
  <path d="M31 67 Q46 54 60 64 Q74 74 89 60 L89 79 L31 79 Z" fill="#7CB683"/>
  <path d="M31 73 Q48 64 62 71 Q76 78 89 70 L89 79 L31 79 Z" fill="#5E9C66"/>
  <path d="M60 40c-3-4-9-3-9 2 0 4 5 7 9 10 4-3 9-6 9-10 0-5-6-6-9-2z" fill="#F4A7B9"/>
  <circle cx="76" cy="38" r="4" fill="#FBE38A"/>

  <!-- ledge holding the frame -->
  <rect x="22" y="84" width="76" height="6" rx="3" fill="#9A6E45"/>

  <!-- floral accents at base -->
  <circle cx="30" cy="132" r="6" fill="#F4A7B9"/>
  <circle cx="30" cy="132" r="2.4" fill="#FBE38A"/>
  <circle cx="40" cy="137" r="4.5" fill="#EF9BB0"/>
  <path d="M22 138 q4-10 12-8" stroke="#5E9C66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 140 q3-8 9-7" stroke="#5E9C66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="135" r="5.5" fill="#F4A7B9"/>
  <circle cx="90" cy="135" r="2.2" fill="#FBE38A"/>
  <path d="M98 139 q-4-9-11-7" stroke="#5E9C66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
