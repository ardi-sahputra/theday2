<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Grapevine corner decoration: vine sweeps from top-right corner inward -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving vine -->
    <path d="M200 8 C 150 18 110 36 80 70 C 56 98 44 132 40 172"
          stroke="#5f7048" stroke-width="4" fill="none"/>
    <!-- Secondary branch -->
    <path d="M120 38 C 138 56 150 78 150 104"
          stroke="#5f7048" stroke-width="3" fill="none" opacity="0.85"/>
    <!-- Tendrils -->
    <path d="M84 64 C 96 56 100 44 92 36 C 86 30 78 34 80 42 C 81 48 88 48 90 42"
          stroke="#8b9d6f" stroke-width="2.4" fill="none"/>
    <path d="M58 118 C 50 110 38 110 36 120 C 35 128 44 132 48 126 C 51 122 46 116 40 118"
          stroke="#8b9d6f" stroke-width="2.4" fill="none"/>
  </g>

  <!-- Vine leaves (sage / olive, characteristic notched grape-leaf shape) -->
  <g fill="#8b9d6f">
    <path d="M150 36 C 132 24 116 26 110 40 C 124 38 132 44 134 56 C 146 52 158 48 150 36 Z"/>
    <path d="M70 96 C 52 88 36 92 32 106 C 46 102 56 108 60 120 C 72 114 86 108 70 96 Z" fill="#6a7d56"/>
  </g>
  <g fill="#5f7048" opacity="0.9">
    <path d="M168 70 C 152 60 138 64 136 78 C 148 74 158 80 160 92 C 172 86 182 82 168 70 Z"/>
  </g>

  <!-- Grape clusters (wine + terracotta-purple berries) -->
  <g>
    <g fill="#722f2f">
      <circle cx="118" cy="92" r="9"/>
      <circle cx="134" cy="96" r="9"/>
      <circle cx="126" cy="108" r="9"/>
      <circle cx="142" cy="110" r="9"/>
      <circle cx="120" cy="122" r="9"/>
      <circle cx="136" cy="124" r="9"/>
      <circle cx="129" cy="138" r="9"/>
    </g>
    <!-- Berry highlights (golden sun glint) -->
    <g fill="#e7b873" opacity="0.7">
      <circle cx="115" cy="89" r="2.4"/>
      <circle cx="131" cy="93" r="2.4"/>
      <circle cx="123" cy="105" r="2.4"/>
      <circle cx="139" cy="107" r="2.4"/>
      <circle cx="117" cy="119" r="2.4"/>
      <circle cx="133" cy="121" r="2.4"/>
      <circle cx="126" cy="135" r="2.4"/>
    </g>
  </g>
</svg>
