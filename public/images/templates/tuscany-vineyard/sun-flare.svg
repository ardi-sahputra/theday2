<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Warm golden sun glow; opaque core fading to fully transparent edge -->
    <radialGradient id="tv-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="18%"  stop-color="#ffe6ad" stop-opacity="0.85"/>
      <stop offset="42%"  stop-color="#f3c574" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#e0a04e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e0a04e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tv-sun-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffaf0" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#fff1ce" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff1ce" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Broad halo -->
  <circle cx="300" cy="300" r="300" fill="url(#tv-sun)"/>
  <!-- Bright inner core -->
  <circle cx="300" cy="300" r="150" fill="url(#tv-sun-core)"/>
</svg>
