<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="acg-base" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1a30"/>
      <stop offset="45%" stop-color="#06101f"/>
      <stop offset="100%" stop-color="#02060c"/>
    </radialGradient>
    <radialGradient id="acg-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf6e3" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#e8e3d3" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#7d6f9b" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#1a2e4a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#02060c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="acg-arm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a9c4ff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#5a6fb0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02060c" stop-opacity="0"/>
    </radialGradient>
    <filter id="acg-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#acg-base)"/>

  <!-- soft spiral band: rotated elliptical arms around the core -->
  <g transform="translate(800 800) rotate(-28)" filter="url(#acg-soft)">
    <ellipse cx="0" cy="0" rx="640" ry="220" fill="url(#acg-arm)"/>
    <ellipse cx="0" cy="0" rx="420" ry="150" fill="url(#acg-arm)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="760" ry="300" fill="url(#acg-arm)" opacity="0.45"/>
  </g>

  <!-- bright galactic core -->
  <circle cx="800" cy="800" r="540" fill="url(#acg-core)"/>

  <!-- scattered starfield -->
  <g fill="#ffffff">
    <circle cx="148" cy="206" r="1.6" opacity="0.7"/>
    <circle cx="372" cy="118" r="1.1" opacity="0.5"/>
    <circle cx="560" cy="92" r="2.0" opacity="0.85"/>
    <circle cx="724" cy="244" r="1.3" opacity="0.6"/>
    <circle cx="916" cy="148" r="1.8" opacity="0.8"/>
    <circle cx="1102" cy="96" r="1.0" opacity="0.45"/>
    <circle cx="1284" cy="220" r="2.2" opacity="0.9"/>
    <circle cx="1452" cy="132" r="1.2" opacity="0.55"/>
    <circle cx="96" cy="468" r="1.4" opacity="0.65"/>
    <circle cx="288" cy="392" r="1.0" opacity="0.4"/>
    <circle cx="1356" cy="448" r="1.6" opacity="0.7"/>
    <circle cx="1508" cy="372" r="1.1" opacity="0.5"/>
    <circle cx="64" cy="720" r="1.9" opacity="0.8"/>
    <circle cx="220" cy="648" r="1.0" opacity="0.42"/>
    <circle cx="1432" cy="688" r="1.5" opacity="0.66"/>
    <circle cx="1552" cy="612" r="1.2" opacity="0.52"/>
    <circle cx="112" cy="980" r="1.7" opacity="0.74"/>
    <circle cx="304" cy="1064" r="1.1" opacity="0.48"/>
    <circle cx="1388" cy="956" r="2.0" opacity="0.84"/>
    <circle cx="1524" cy="1048" r="1.0" opacity="0.44"/>
    <circle cx="176" cy="1248" r="1.5" opacity="0.64"/>
    <circle cx="396" cy="1356" r="1.2" opacity="0.54"/>
    <circle cx="604" cy="1452" r="1.9" opacity="0.82"/>
    <circle cx="812" cy="1388" r="1.1" opacity="0.46"/>
    <circle cx="1008" cy="1480" r="1.7" opacity="0.72"/>
    <circle cx="1212" cy="1356" r="1.0" opacity="0.4"/>
    <circle cx="1416" cy="1268" r="2.1" opacity="0.86"/>
    <circle cx="1548" cy="1448" r="1.3" opacity="0.58"/>
    <circle cx="512" cy="556" r="1.0" opacity="0.5"/>
    <circle cx="1096" cy="612" r="1.2" opacity="0.55"/>
    <circle cx="688" cy="1124" r="1.1" opacity="0.5"/>
    <circle cx="1004" cy="1056" r="1.3" opacity="0.6"/>
    <circle cx="452" cy="884" r="1.0" opacity="0.45"/>
    <circle cx="1140" cy="892" r="1.4" opacity="0.62"/>
  </g>

  <!-- a few warm gold stars -->
  <g fill="#d4af37">
    <circle cx="440" cy="300" r="2.0" opacity="0.85"/>
    <circle cx="1180" cy="380" r="1.7" opacity="0.75"/>
    <circle cx="620" cy="1280" r="1.9" opacity="0.8"/>
    <circle cx="1280" cy="1140" r="1.6" opacity="0.7"/>
