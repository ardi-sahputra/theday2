<svg width="160" height="130" viewBox="0 0 160 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#C9962F"/>
    </linearGradient>
    <radialGradient id="frameGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="62" rx="72" ry="52" fill="url(#frameGlow)"/>
  <!-- back frame (tilted left) -->
  <g transform="rotate(-7 44 64)">
    <rect x="16" y="34" width="58" height="68" rx="6" fill="#2E3F6F" stroke="url(#frameGold)" stroke-width="3"/>
    <rect x="24" y="42" width="42" height="44" rx="3" fill="#16233E"/>
    <!-- little moon + star photo -->
    <circle cx="38" cy="58" r="8" fill="#FBF3DC"/>
    <path d="M55 50 l1.5 3 3.2 .5 -2.3 2.2 .5 3.2 -2.9 -1.5 -2.9 1.5 .5 -3.2 -2.3 -2.2 3.2 -.5 z" fill="#F5D27A"/>
    <rect x="24" y="90" width="42" height="8" rx="2" fill="#2E3F6F"/>
  </g>
  <!-- front frame (tilted right) -->
  <g transform="rotate(6 110 70)">
    <rect x="82" y="40" width="62" height="74" rx="6" fill="#3A4E84" stroke="url(#frameGold)" stroke-width="3"/>
    <rect x="91" y="49" width="44" height="48" rx="3" fill="#0D1B2A"/>
    <!-- two heads silhouette photo -->
    <circle cx="106" cy="74" r="9" fill="#FBF3DC"/>
    <circle cx="122" cy="76" r="8" fill="#DCE6FF"/>
    <path d="M97 97 Q113 85 130 97 Z" fill="#5566A8"/>
    <rect x="91" y="101" width="44" height="8" rx="2" fill="#3A4E84"/>
  </g>
  <!-- hanging string with star -->
  <path d="M110 40 Q120 20 132 30" stroke="#C9962F" stroke-width="2" fill="none"/>
</svg>
