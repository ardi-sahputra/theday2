<svg width="120" height="180" viewBox="0 0 120 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- warm glow halo -->
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F5C95B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5C95B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lanternGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#C9962F"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="92" r="52" fill="url(#lanternGlow)"/>
  <!-- hanging cord -->
  <path d="M60 4 L60 26" stroke="#C9962F" stroke-width="3" stroke-linecap="round"/>
  <!-- top ring -->
  <path d="M50 26 Q60 16 70 26" stroke="url(#lanternGold)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- top cap -->
  <path d="M40 40 L80 40 L72 28 L48 28 Z" fill="url(#lanternGold)"/>
  <!-- lantern body frame -->
  <rect x="42" y="44" width="36" height="84" rx="10" fill="#1B2A4A" stroke="url(#lanternGold)" stroke-width="4"/>
  <!-- glowing glass panel -->
  <rect x="50" y="52" width="20" height="68" rx="7" fill="#FFE9A8"/>
  <rect x="50" y="52" width="20" height="68" rx="7" fill="#FFD773" opacity="0.5"/>
  <!-- flame -->
  <path d="M60 78 C54 86 56 96 60 100 C64 96 66 86 60 78 Z" fill="#FF9D3C"/>
  <ellipse cx="60" cy="94" rx="3.5" ry="6" fill="#FFF4C2"/>
  <!-- vertical bars -->
  <path d="M60 50 L60 122" stroke="#C9962F" stroke-width="2" opacity="0.6"/>
  <!-- bottom base -->
  <path d="M44 128 L76 128 L70 142 L50 142 Z" fill="url(#lanternGold)"/>
  <ellipse cx="60" cy="146" rx="13" ry="4" fill="#C9962F"/>
</svg>
