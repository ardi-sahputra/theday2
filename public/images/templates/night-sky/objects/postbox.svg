<svg width="110" height="160" viewBox="0 0 110 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="postGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#C9962F"/>
    </linearGradient>
    <linearGradient id="postBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E3F6F"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <radialGradient id="postGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="55" cy="62" rx="42" ry="46" fill="url(#postGlow)"/>
  <!-- post leg -->
  <rect x="48" y="118" width="14" height="36" rx="3" fill="#3A4E84"/>
  <ellipse cx="55" cy="154" rx="20" ry="5" fill="#16233E"/>
  <!-- box body -->
  <rect x="24" y="40" width="62" height="84" rx="14" fill="url(#postBody)" stroke="url(#postGold)" stroke-width="3"/>
  <!-- rounded dome top -->
  <path d="M24 54 Q24 26 55 26 Q86 26 86 54 Z" fill="#2E3F6F" stroke="url(#postGold)" stroke-width="3"/>
  <!-- mail slot -->
  <rect x="38" y="46" width="34" height="7" rx="3.5" fill="#0D1B2A"/>
  <!-- gold band -->
  <rect x="24" y="86" width="62" height="9" fill="url(#postGold)"/>
  <!-- little envelope peeking out -->
  <g transform="translate(0,0)">
    <rect x="44" y="38" width="22" height="15" rx="2" fill="#FBF3DC" transform="rotate(-8 55 46)"/>
    <path d="M45 41 L55 47 L66 40" stroke="#C9962F" stroke-width="1.5" fill="none" transform="rotate(-8 55 46)"/>
  </g>
  <!-- star emblem -->
  <path d="M55 104 l2 4 4.4 .6 -3.2 3.1 .8 4.3 -4 -2 -4 2 .8 -4.3 -3.2 -3.1 4.4 -.6 z" fill="url(#postGold)"/>
</svg>
