<svg width="120" height="150" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="signWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C6FA8"/>
      <stop offset="100%" stop-color="#3A4E84"/>
    </linearGradient>
    <linearGradient id="signGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#C9962F"/>
    </linearGradient>
  </defs>
  <!-- post -->
  <rect x="54" y="20" width="12" height="120" rx="4" fill="#3A4E84"/>
  <rect x="54" y="20" width="5" height="120" rx="2" fill="#5C6FA8"/>
  <!-- top board (pointing right) -->
  <path d="M18 38 L96 38 L108 50 L96 62 L18 62 Z" fill="url(#signWood)" stroke="url(#signGold)" stroke-width="2.5"/>
  <line x1="28" y1="48" x2="84" y2="48" stroke="#FBF3DC" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="28" y1="55" x2="70" y2="55" stroke="#FBF3DC" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- second board (pointing left) -->
  <path d="M102 80 L24 80 L12 92 L24 104 L102 104 Z" fill="url(#signWood)" stroke="url(#signGold)" stroke-width="2.5"/>
  <line x1="36" y1="90" x2="92" y2="90" stroke="#FBF3DC" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="50" y1="97" x2="92" y2="97" stroke="#FBF3DC" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- little star ornament on top -->
  <path d="M60 6 l2.5 5 5.5 .8 -4 4 1 5.5 -5 -2.6 -5 2.6 1 -5.5 -4 -4 5.5 -.8 z" fill="url(#signGold)"/>
</svg>
