<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" preserveAspectRatio="none">
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.65
                0 0 0 0 0.57
                0 0 0 0 0.43
                0 0 0 0.04 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="paperVignette" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f8f1e7" stop-opacity="0"/>
      <stop offset="78%" stop-color="#e9ddc8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cdbb9a" stop-opacity="0.42"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="#f8f1e7"/>
  <rect width="600" height="800" fill="#f8f1e7" filter="url(#paperNoise)" opacity="0.85"/>
  <rect width="600" height="800" fill="url(#paperVignette)"/>
</svg>
