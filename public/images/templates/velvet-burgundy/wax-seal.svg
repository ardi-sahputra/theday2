<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="wax" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#a8232a"/>
      <stop offset="45%" stop-color="#8b1a1f"/>
      <stop offset="100%" stop-color="#5c1a1b"/>
    </radialGradient>
    <radialGradient id="waxHi" cx="40%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#d8595f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d8595f" stop-opacity="0"/>
    </radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#2d0507" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- molten wax outer blob with uneven edge -->
  <path d="M60 4
           C74 4 80 12 92 14 C104 16 110 26 108 40
           C106 52 116 60 114 74 C112 88 100 92 92 104
           C84 114 72 110 60 114 C48 110 36 114 28 104
           C20 92 8 88 6 74 C4 60 14 52 12 40
           C10 26 16 16 28 14 C40 12 46 4 60 4 Z"
        fill="url(#wax)" filter="url(#emboss)"/>
  <!-- inner pressed disc -->
  <circle cx="60" cy="60" r="46" fill="#7a161b"/>
  <circle cx="60" cy="60" r="46" fill="url(#waxHi)"/>

  <!-- embossed gold ornament ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#a87a4a" stroke-width="1.4" opacity="0.85"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#d4a574" stroke-width="1.8"/>
  <circle cx="60" cy="60" r="33" fill="none" stroke="#a87a4a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- laurel dots around ring -->
  <g fill="#d4a574">
    <circle cx="60" cy="20" r="1.6"/>
    <circle cx="88.3" cy="31.7" r="1.6"/>
    <circle cx="100" cy="60" r="1.6"/>
    <circle cx="88.3" cy="88.3" r="1.6"/>
    <circle cx="60" cy="100" r="1.6"/>
    <circle cx="31.7" cy="88.3" r="1.6"/>
    <circle cx="20" cy="60" r="1.6"/>
    <circle cx="31.7" cy="31.7" r="1.6"/>
  </g>
</svg>
