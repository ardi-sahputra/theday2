<svg xmlns="http://www.w3.org/2000/svg" width="96" height="112" viewBox="0 0 96 112">
  <defs>
    <filter id="sb" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="39" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0 0.26 0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="96" height="112" fill="#f4ead5"/>
  <rect x="6" y="6" width="84" height="100" fill="#e8dcc4"/>
  <rect x="6" y="6" width="84" height="100" fill="none" stroke="#f4ead5" stroke-width="3"
        stroke-dasharray="0.1 6" stroke-linecap="round"/>
  <rect x="12" y="12" width="72" height="88" fill="none" stroke="#8b3a3a" stroke-width="1.5"/>
  <!-- motif: Balinese candi bentar split gate temple -->
  <g transform="translate(48,20)" fill="#8b3a3a" stroke="#3a2d1f" stroke-width="0.8">
    <!-- left tower -->
    <path d="M-22 60 L-22 22 L-18 22 L-16 14 L-14 8 L-11 8 L-11 60 Z"/>
    <!-- right tower (mirror) -->
    <path d="M22 60 L22 22 L18 22 L16 14 L14 8 L11 8 L11 60 Z"/>
    <!-- step tiers -->
    <g stroke="#f4ead5" stroke-width="0.8">
      <line x1="-22" y1="34" x2="-11" y2="34"/>
      <line x1="-21" y1="46" x2="-11" y2="46"/>
      <line x1="22" y1="34" x2="11" y2="34"/>
      <line x1="21" y1="46" x2="11" y2="46"/>
    </g>
    <!-- base steps -->
    <rect x="-26" y="58" width="15" height="4" fill="#5c4a3a"/>
    <rect x="11" y="58" width="15" height="4" fill="#5c4a3a"/>
  </g>
  <text x="48" y="92" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#3a2d1f" letter-spacing="3">BALI</text>
  <rect width="96" height="112" filter="url(#sb)"/>
</svg>
