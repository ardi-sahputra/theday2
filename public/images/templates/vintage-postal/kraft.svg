<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" preserveAspectRatio="none">
  <defs>
    <filter id="kraftTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="3" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.18 0" result="grain"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3" result="blotch"/>
      <feColorMatrix in="blotch" type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.31  0 0 0 0 0.19  0 0 0 0.10 0" result="blotchC"/>
      <feMerge>
        <feMergeNode in="blotchC"/>
        <feMergeNode in="grain"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#d8c8a0"/>
  <rect width="600" height="600" fill="#cdbb8e"/>
  <rect width="600" height="600" filter="url(#kraftTex)"/>
</svg>
