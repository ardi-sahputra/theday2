<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="waxBody" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#a04848"/>
      <stop offset="55%" stop-color="#8b3a3a"/>
      <stop offset="100%" stop-color="#5e2424"/>
    </radialGradient>
    <radialGradient id="waxInner" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7a2e2e"/>
      <stop offset="100%" stop-color="#8b3a3a"/>
    </radialGradient>
    <filter id="waxShade" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- molten blob edge -->
  <path d="M40 5
           C50 5 56 9 60 15
           C70 17 75 24 73 33
           C77 41 74 50 67 54
           C66 64 58 70 49 69
           C43 75 33 75 27 69
           C18 70 11 63 13 54
           C7 49 6 39 11 33
           C8 24 14 16 24 15
           C29 8 34 5 40 5 Z"
        fill="url(#waxBody)" stroke="#5e2424" stroke-width="0.5"/>
  <!-- raised inner disc -->
  <circle cx="40" cy="40" r="26" fill="url(#waxInner)"/>
  <circle cx="40" cy="40" r="26" fill="none" stroke="#5e2424" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="40" cy="40" r="22" fill="none" stroke="#a04848" stroke-opacity="0.5" stroke-width="1"/>
  <!-- embossed laurel motif framing the overlaid monogram -->
  <g stroke="#c97a7a" stroke-opacity="0.55" stroke-width="1.4" fill="none" filter="url(#waxShade)">
    <path d="M24 52 Q22 44 26 37"/>
    <path d="M56 52 Q58 44 54 37"/>
  </g>
  <!-- decorative dots -->
  <g fill="#c97a7a" fill-opacity="0.5">
    <circle cx="40" cy="20" r="1.4"/>
    <circle cx="40" cy="60" r="1.4"/>
  </g>
  <!-- soft top highlight -->
  <ellipse cx="33" cy="30" rx="10" ry="6" fill="#c97a7a" fill-opacity="0.22"/>
</svg>
