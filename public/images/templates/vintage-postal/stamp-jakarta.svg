<svg xmlns="http://www.w3.org/2000/svg" width="96" height="112" viewBox="0 0 96 112">
  <defs>
    <filter id="sj" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="45" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0 0.26 0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="96" height="112" fill="#f4ead5"/>
  <rect x="6" y="6" width="84" height="100" fill="#e8dcc4"/>
  <rect x="6" y="6" width="84" height="100" fill="none" stroke="#f4ead5" stroke-width="3"
        stroke-dasharray="0.1 6" stroke-linecap="round"/>
  <rect x="12" y="12" width="72" height="88" fill="none" stroke="#8b3a3a" stroke-width="1.5"/>
  <!-- motif: Monas (National Monument) -->
  <g transform="translate(48,16)" fill="none" stroke="#3a2d1f" stroke-width="1.8" stroke-linecap="round">
    <!-- flame -->
    <path d="M0 4 C-4 9 -3 14 0 14 C3 14 4 9 0 4 Z" fill="#8b3a3a" stroke="#8b3a3a"/>
    <!-- cup / tray -->
    <path d="M-7 16 L7 16 L4 20 L-4 20 Z" fill="#8b3a3a" stroke="#8b3a3a"/>
    <!-- obelisk shaft -->
    <path d="M-3 20 L-2 58 L2 58 L3 20"/>
    <!-- base plinth -->
    <path d="M-13 58 L13 58 L16 66 L-16 66 Z" fill="#8b3a3a" fill-opacity="0.25"/>
  </g>
  <text x="48" y="92" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#3a2d1f" letter-spacing="1">JAKARTA</text>
  <rect width="96" height="112" filter="url(#sj)"/>
</svg>
