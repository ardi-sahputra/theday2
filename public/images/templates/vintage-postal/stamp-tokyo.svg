      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0 0.26 0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="96" height="112" fill="#f4ead5"/>
  <rect x="6" y="6" width="84" height="100" fill="#e8dcc4"/>
  <rect x="6" y="6" width="84" height="100" fill="none" stroke="#f4ead5" stroke-width="3"
