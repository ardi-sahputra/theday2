<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCEFD8"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="28" ry="5" fill="#000000" opacity="0.12"/>
  <!-- GROOM (left) -->
  <g>
    <!-- legs -->
    <rect x="33" y="66" width="5" height="26" rx="2" fill="#3A4A63"/>
    <rect x="40" y="66" width="5" height="26" rx="2" fill="#3A4A63"/>
    <!-- body / suit -->
    <path d="M30 44 q9 -6 18 0 v24 h-18 z" fill="#42526E"/>
    <!-- shirt -->
    <path d="M39 44 v22 h-1 l-2-22z" fill="#FFFFFF"/>
    <path d="M39 46 l-3 6 3 3 3-3z" fill="#E85A3C"/>
    <!-- head -->
    <circle cx="39" cy="38" r="7" fill="#E8B98C"/>
    <path d="M32 36 q7 -9 14 0 q-3 -3 -7 -3 q-4 0 -7 3z" fill="#5A3E2A"/>
  </g>
  <!-- BRIDE (right) -->
  <g>
    <!-- dress -->
    <path d="M52 44 q9 -6 18 0 q3 24 4 48 h-26 q1 -24 4 -48z" fill="url(#dress)" stroke="#EAD9B8" stroke-width="0.8"/>
    <!-- head -->
    <circle cx="61" cy="38" r="7" fill="#F0C39B"/>
    <path d="M54 38 q1 -10 7 -10 q6 0 7 10 q-3 -4 -7 -4 q-4 0 -7 4z" fill="#8A5A33"/>
    <!-- bouquet -->
    <circle cx="56" cy="58" r="4" fill="#F4A6B8"/>
    <circle cx="59" cy="60" r="3" fill="#FFD56B"/>
  </g>
  <!-- holding hands heart -->
  <path d="M50 60 c-2-3-6-1.5-6 1.5 0 2 3 3.5 6 5.5 3-2 6-3.5 6-5.5 0-3-4-4.5-6-1.5z" fill="#E85A3C" opacity="0.9"/>
</svg>
