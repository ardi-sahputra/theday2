<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FD8C7"/>
      <stop offset="0.5" stop-color="#CFEFE6"/>
      <stop offset="1" stop-color="#7FC4B0"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="90" rx="26" ry="5" fill="#000000" opacity="0.12"/>
  <!-- lying bottle, slight tilt -->
  <g transform="rotate(-18 50 55)">
    <!-- body -->
    <rect x="26" y="44" width="44" height="26" rx="13" fill="url(#glass)" stroke="#6FB3A0" stroke-width="1.2"/>
    <!-- neck -->
    <rect x="68" y="50" width="14" height="14" rx="3" fill="url(#glass)" stroke="#6FB3A0" stroke-width="1.2"/>
    <!-- cork -->
    <rect x="80" y="50" width="8" height="14" rx="2" fill="#C49A5E"/>
    <!-- rolled message -->
    <rect x="36" y="50" width="20" height="14" rx="2" fill="#FFF7E6"/>
    <path d="M40 53 h12 M40 57 h12 M40 61 h8" stroke="#D9B98A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- glass highlight -->
    <rect x="32" y="48" width="4" height="18" rx="2" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
