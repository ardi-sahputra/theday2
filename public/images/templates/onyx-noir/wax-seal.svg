<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="onx-seal-face" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="45%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="onx-seal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a6608"/>
    </linearGradient>
    <radialGradient id="onx-seal-sheen" cx="40%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="onx-seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- wax disc body -->
  <g filter="url(#onx-seal-shadow)">
    <circle cx="256" cy="256" r="228" fill="url(#onx-seal-face)"/>
  </g>

  <!-- soft top sheen for embossed wax feel -->
  <circle cx="256" cy="256" r="228" fill="url(#onx-seal-sheen)"/>

  <!-- thin gold embossed border rings -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#onx-seal-gold)" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#onx-seal-gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#onx-seal-gold)" stroke-width="1.5" opacity="0.7"/>

  <!-- ring of fine dots between the borders -->
  <g fill="url(#onx-seal-gold)">
    <circle cx="256" cy="67"  r="3.2"/>
    <circle cx="389" cy="123" r="3.2"/>
    <circle cx="445" cy="256" r="3.2"/>
    <circle cx="389" cy="389" r="3.2"/>
    <circle cx="256" cy="445" r="3.2"/>
    <circle cx="123" cy="389" r="3.2"/>
    <circle cx="67"  cy="256" r="3.2"/>
    <circle cx="123" cy="123" r="3.2"/>
  </g>

  <!-- small laurel flourishes flanking the (overlaid) monogram -->
  <g fill="none" stroke="url(#onx-seal-gold)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <path d="M150 256 q22 -30 52 -24 q-26 14 -52 24 q26 4 52 24 q-30 6 -52 -24"/>
    <path d="M362 256 q-22 -30 -52 -24 q26 14 52 24 q-26 4 -52 24 q30 6 52 -24"/>
  </g>
</svg>
