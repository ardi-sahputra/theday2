name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.theday.id
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Key-only. Password auth ditolak server ini — kalau dibiarkan sebagai
          # fallback, kegagalan key jadi diam-diam dan errornya menyesatkan.
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/u144336260/domains/staging.theday.id/public_html
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin develop
            git reset --hard origin/develop
            DEPLOY_PREVIOUS_SHA=$PREV_SHA bash scripts/deploy.sh staging
