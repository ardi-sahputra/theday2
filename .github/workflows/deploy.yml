name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://theday.id
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Key dulu, password sebagai cadangan. Kalau SSH_PRIVATE_KEY kosong
          # atau formatnya rusak, action diam-diam jatuh ke password — cek
          # docs/DEPLOYMENT.md kalau lognya bilang "attempted methods [none password]".
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/u144336260/domains/theday.id/public_html
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_PREVIOUS_SHA=$PREV_SHA bash scripts/deploy.sh production
