name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://theday.id
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Key-only. Password auth ditolak server ini — kalau dibiarkan sebagai
          # fallback, kegagalan key jadi diam-diam dan errornya menyesatkan.
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/u144336260/domains/theday.id/public_html
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_PREVIOUS_SHA=$PREV_SHA bash scripts/deploy.sh production
